name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uvx bandit -q -r src -ll
      - run: uv run --with pip-audit pip-audit --skip-editable

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Full-history scan with the pinned binary. (gitleaks-action computes `<first>^..<head>`
      # on push, which fails when the range starts at a root commit.)
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  database:
    name: database tests (PostgreSQL 16 + pgvector)
    needs: static
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci-throwaway-password  # ephemeral CI container, no data
          TZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      SENTINELAI_TEST_ADMIN_URL: postgresql://postgres:ci-throwaway-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Database acceptance tests (must run, never skip)
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/db -m db -rs | tee db.log
          if grep -q "SKIPPED" db.log; then echo "::error::database tests were skipped"; exit 1; fi

  test:
    name: tests (${{ matrix.os }})
    needs: static
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Database tests are skipped here (no service containers on Windows/macOS runners);
      # the dedicated database job above runs them and fails if any is skipped.
      - run: uv run pytest -m "not db and not live" --cov --cov-report=term --cov-fail-under=80
      - name: CLI smoke test
        run: |
          uv run sentinelai version
          uv run sentinelai providers list --json
          uv run sentinelai doctor --json
