# Phase 0 collector: receives OTLP/HTTP and logs a summary. The Phase 1 reference app sends
# here; Phase 2 adds the exporter to sentinel-telemetry and a file exporter for recorded mode.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    logs: {receivers: [otlp], processors: [batch], exporters: [debug]}
    metrics: {receivers: [otlp], processors: [batch], exporters: [debug]}
    traces: {receivers: [otlp], processors: [batch], exporters: [debug]}
