# Local development stack (docs/design/07 section 5).
#   docker compose --profile core up -d        # Postgres 16 + pgvector, OTel Collector
# On Windows+WSL2 the VM stops when idle; containers restart with Docker (restart policy).
# Ports bind to 127.0.0.1 only. Credentials come from .env (git-ignored); see .env.example.
name: sentinelai

services:
  postgres:
    profiles: ["core"]
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SENTINELAI_DEV_DB_PASSWORD:?set SENTINELAI_DEV_DB_PASSWORD in .env}
      POSTGRES_DB: sentinel
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    ports:
      - "127.0.0.1:${SENTINELAI_DEV_DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinel"]
      interval: 2s
      timeout: 3s
      retries: 30

  otel-collector:
    profiles: ["core"]
    image: otel/opentelemetry-collector-contrib:0.115.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"   # OTLP/HTTP
      - "127.0.0.1:13133:13133" # health_check extension

volumes:
  pgdata:
